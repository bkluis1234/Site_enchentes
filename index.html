<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Ocorrências - TCC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
<div class="container">
    <h2>Registrar Ocorrência de Enchente</h2>
    <form id="formOcorrencia">
        <label for="tipo">Tipo:</label>
        <input type="text" id="tipo" required placeholder="Ex: Alagamento">

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" required placeholder="Detalhes do local..."></textarea>

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" required placeholder="Nome do bairro">

        <label for="latitude">Latitude:</label>
        <input type="number" step="any" id="latitude" required placeholder="-23.550520">

        <label for="longitude">Longitude:</label>
        <input type="number" step="any" id="longitude" required placeholder="-46.633308">

        <button type="submit">Enviar Ocorrência</button>

    </form>

    <hr style="margin: 30px 0;">

    <h2>Ocorrências Registradas</h2>
    <div id="listaOcorrencias">Carregando...</div>

</div>

<!--Link do JS-->
<script src="script.js"></script>

</body>
</html>
